appId: com.align.posture
productName: Align
afterPack: scripts/after-pack.mjs
directories:
  output: dist
  buildResources: assets
files:
  - out/**/*
  - public/mediapipe/**/*
asarUnpack:
  - "**/*.wasm"
  - "**/*.task"
mac:
  category: public.app-category.healthcare-fitness
  target:
    - dmg
  artifactName: Align-${version}-macos-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: Align-${version}-win-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
linux:
  target:
    - AppImage
  artifactName: Align-${version}-linux-${arch}.${ext}
